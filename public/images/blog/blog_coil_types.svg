<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stat pills -->
  <rect x="60" y="42" width="280" height="32" rx="16" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="200" y="64" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="12" font-weight="bold">SERIES = IMPEDANCE ADDS</text>

  <rect x="860" y="42" width="280" height="32" rx="16" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="1000" y="64" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="12" font-weight="bold">PARALLEL = IMPEDANCE HALVES</text>

  <!-- Card 1: DVC -->
  <rect x="60" y="120" width="262" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="60" y="120" width="262" height="44" rx="16" fill="#fbbf24"/>
  <rect x="60" y="138" width="262" height="26" fill="#fbbf24"/>
  <text x="191" y="152" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="15" font-weight="bold">DVC SPEAKER</text>
  <text x="191" y="210" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Dual Voice Coil</text>
  <line x1="80" y1="226" x2="302" y2="226" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="191" y="254" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Two coils wound on one</text>
  <text x="191" y="272" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">speaker, typical coils are</text>
  <text x="191" y="290" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">2 O or 4 O impedance.</text>
  <rect x="131" y="372" width="120" height="24" rx="12" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.5)" stroke-width="1"/>
  <text x="191" y="389" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="10" font-weight="bold">SUBWOOFER / AUDIO</text>

  <!-- Card 2: Relay -->
  <rect x="338" y="120" width="262" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="338" y="120" width="262" height="44" rx="16" fill="#3b82f6"/>
  <rect x="338" y="138" width="262" height="26" fill="#3b82f6"/>
  <text x="469" y="152" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">RELAY</text>
  <text x="469" y="210" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Relay Coil</text>
  <line x1="358" y1="226" x2="580" y2="226" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="469" y="254" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Energizes mechanical switch</text>
  <text x="469" y="272" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">contacts. Drive with 5 V or</text>
  <text x="469" y="290" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">12 V DC. Add a flyback diode.</text>
  <rect x="409" y="372" width="120" height="24" rx="12" fill="rgba(59,130,246,0.18)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="469" y="389" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="10" font-weight="bold">ARDUINO / SWITCHING</text>

  <!-- Card 3: Solenoid -->
  <rect x="616" y="120" width="262" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="616" y="120" width="262" height="44" rx="16" fill="#22d3ee"/>
  <rect x="616" y="138" width="262" height="26" fill="#22d3ee"/>
  <text x="747" y="152" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="15" font-weight="bold">SOLENOID</text>
  <text x="747" y="210" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Solenoid Coil</text>
  <line x1="636" y1="226" x2="858" y2="226" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="747" y="254" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Pulls a plunger to open</text>
  <text x="747" y="272" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">or close a valve or lock.</text>
  <text x="747" y="290" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Typical drive is 6-24 V DC.</text>
  <rect x="687" y="372" width="120" height="24" rx="12" fill="rgba(34,211,238,0.15)" stroke="rgba(34,211,238,0.5)" stroke-width="1"/>
  <text x="747" y="389" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="10" font-weight="bold">VALVES / LOCKS</text>

  <!-- Card 4: Inductor -->
  <rect x="894" y="120" width="262" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="894" y="120" width="262" height="44" rx="16" fill="#22c55e"/>
  <rect x="894" y="138" width="262" height="26" fill="#22c55e"/>
  <text x="1025" y="152" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">INDUCTOR</text>
  <text x="1025" y="210" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Inductor Coil</text>
  <line x1="914" y1="226" x2="1136" y2="226" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1025" y="254" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Stores energy in a magnetic</text>
  <text x="1025" y="272" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">field. Measured in henries (H)</text>
  <text x="1025" y="290" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">from microhenries to henries.</text>
  <rect x="965" y="372" width="120" height="24" rx="12" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <text x="1025" y="389" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="10" font-weight="bold">POWER CIRCUITS</text>

  <!-- Note -->
  <text x="600" y="455" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Measure a coil with an ohmmeter before powering it. A reading near 0 O means a shorted coil.</text>

  <!-- Title -->
  <text x="600" y="505" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="44" font-weight="bold">Common Coil Types and How They Wire</text>

  <!-- Subtitle -->
  <text x="600" y="548" text-anchor="middle" fill="url(#t1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Choose the Right Coil for Your Circuit</text>

  <!-- Badge -->
  <rect x="500" y="572" width="200" height="30" rx="15" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <text x="600" y="592" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="bold">REFERENCE</text>
</svg>