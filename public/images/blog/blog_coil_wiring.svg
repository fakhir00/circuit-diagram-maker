<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stat pills -->
  <rect x="80" y="42" width="270" height="32" rx="16" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="215" y="64" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="13" font-weight="bold">SERIES: 2 O + 2 O = 4 O</text>

  <rect x="850" y="42" width="270" height="32" rx="16" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="985" y="64" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="13" font-weight="bold">PARALLEL: 2 O / 2 O = 1 O</text>

  <!-- SERIES panel -->
  <text x="320" y="128" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">SERIES</text>

  <!-- Amp -->
  <rect x="80" y="180" width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="222" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">AMP</text>
  <circle cx="160" cy="185" r="5" fill="#fbbf24"/>
  <circle cx="160" cy="245" r="5" fill="#fbbf24"/>

  <!-- VC1 and VC2 -->
  <rect x="260" y="165" width="130" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="325" y="195" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">VC1</text>
  <text x="325" y="218" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12">2 O</text>

  <rect x="430" y="165" width="130" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="495" y="195" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">VC2</text>
  <text x="495" y="218" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12">2 O</text>

  <!-- Series wires -->
  <g stroke="#fbbf24" stroke-width="4" fill="none">
    <line x1="160" y1="185" x2="260" y2="185"/>
    <line x1="390" y1="185" x2="430" y2="185"/>
    <line x1="560" y1="185" x2="560" y2="260"/>
    <line x1="560" y1="260" x2="160" y2="260"/>
    <line x1="160" y1="260" x2="160" y2="245"/>
  </g>
  <circle cx="390" cy="185" r="6" fill="#fbbf24"/>
  <circle cx="430" cy="185" r="6" fill="#fbbf24"/>
  <circle cx="560" cy="260" r="6" fill="#fbbf24"/>
  <circle cx="160" cy="260" r="6" fill="#fbbf24"/>

  <text x="320" y="405" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="bold">2 O coils in series produce 4 O total</text>

  <!-- VS circle -->
  <circle cx="600" cy="212" r="34" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">VS</text>

  <!-- PARALLEL panel -->
  <text x="860" y="128" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">PARALLEL</text>

  <!-- Amp -->
  <rect x="660" y="170" width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="710" y="212" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">AMP</text>
  <circle cx="760" cy="190" r="5" fill="#38bdf8"/>
  <circle cx="760" cy="230" r="5" fill="#38bdf8"/>

  <!-- VC1 and VC2 side by side -->
  <rect x="800" y="180" width="120" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="860" y="212" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">VC1</text>
  <text x="860" y="234" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="11">2 O</text>

  <rect x="950" y="180" width="120" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="1010" y="212" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="bold">VC2</text>
  <text x="1010" y="234" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="11">2 O</text>

  <!-- Parallel rails -->
  <g stroke="#38bdf8" stroke-width="4" fill="none">
    <line x1="760" y1="190" x2="760" y2="140"/>
    <line x1="760" y1="140" x2="1070" y2="140"/>
    <line x1="860" y1="140" x2="860" y2="180"/>
    <line x1="1010" y1="140" x2="1010" y2="180"/>
    <line x1="860" y1="250" x2="860" y2="290"/>
    <line x1="1010" y1="250" x2="1010" y2="290"/>
    <line x1="760" y1="290" x2="1070" y2="290"/>
    <line x1="760" y1="230" x2="760" y2="290"/>
  </g>
  <circle cx="861" cy="140" r="6" fill="#38bdf8"/>
  <circle cx="1011" cy="140" r="6" fill="#38bdf8"/>
  <circle cx="861" cy="290" r="6" fill="#38bdf8"/>
  <circle cx="1011" cy="290" r="6" fill="#38bdf8"/>
  <circle cx="761" cy="140" r="6" fill="#38bdf8"/>
  <circle cx="761" cy="290" r="6" fill="#38bdf8"/>

  <text x="860" y="405" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="14" font-weight="bold">2 O coils in parallel produce 1 O total</text>

  <!-- Title -->
  <text x="600" y="465" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="bold">Coil Wiring Diagram</text>

  <!-- Subtitle -->
  <text x="600" y="507" text-anchor="middle" fill="url(#c1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Dual Voice Coil Series and Parallel Wiring Guide</text>

  <!-- Badge -->
  <rect x="470" y="534" width="260" height="30" rx="15" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="600" y="554" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">SERIES &amp; PARALLEL WIRING</text>
</svg>