<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stat pills -->
  <rect x="290" y="46" width="210" height="30" rx="15" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="395" y="66" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="13" font-weight="bold">OUTPUT 13.8-14.5 V</text>

  <rect x="512" y="46" width="170" height="30" rx="15" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="597" y="66" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="13" font-weight="bold">RATED 120 A</text>

  <!-- Charge lamp -->
  <text x="150" y="46" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="11" font-weight="bold">CHARGE LAMP</text>
  <circle cx="150" cy="78" r="22" fill="#1e293b" stroke="#f87171" stroke-width="2.5"/>
  <line x1="143" y1="88" x2="150" y2="70" stroke="#fca5a5" stroke-width="2"/>
  <line x1="157" y1="88" x2="150" y2="70" stroke="#fca5a5" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="100" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Wiring harness box -->
  <rect x="60" y="140" width="190" height="180" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <text x="155" y="163" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12" font-weight="bold">ENGINE WIRING HARNESS</text>

  <text x="75" y="200" fill="#f87171" font-family="Arial,sans-serif" font-size="12" font-weight="bold">L - CHARGE LAMP</text>
  <rect x="218" y="188" width="14" height="14" rx="3" fill="#ef4444"/>

  <text x="75" y="234" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">S - SENSE</text>
  <rect x="218" y="222" width="14" height="14" rx="3" fill="#e2e8f0"/>

  <text x="75" y="268" fill="#60a5fa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">F - FIELD / IGN</text>
  <rect x="218" y="256" width="14" height="14" rx="3" fill="#3b82f6"/>

  <text x="75" y="302" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="bold">GND - BATT GROUND</text>
  <rect x="218" y="290" width="14" height="14" rx="3" fill="#22c55e"/>

  <!-- Ignition -->
  <line x1="150" y1="320" x2="150" y2="336" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="150" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="11" font-weight="bold">IGNITION +12 V</text>

  <!-- Connector -->
  <rect x="262" y="150" width="58" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="291" y="177" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="10" font-weight="bold">L</text>
  <text x="291" y="203" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">S</text>
  <text x="291" y="229" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="10" font-weight="bold">F</text>
  <text x="291" y="255" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="10" font-weight="bold">G</text>
  <text x="291" y="285" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">E-70</text>

  <!-- Connector pins to harness -->
  <line x1="262" y1="170" x2="252" y2="170" stroke="#ef4444" stroke-width="4"/>
  <line x1="262" y1="196" x2="252" y2="196" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="262" y1="222" x2="252" y2="222" stroke="#3b82f6" stroke-width="4"/>
  <line x1="262" y1="248" x2="252" y2="248" stroke="#22c55e" stroke-width="4"/>

  <!-- Alternator -->
  <rect x="320" y="120" width="240" height="180" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <text x="440" y="163" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">ALTERNATOR</text>
  <text x="440" y="184" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">3.5 L V6 - 12 V DC</text>

  <rect x="350" y="230" width="120" height="52" rx="8" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.5)" stroke-width="1.5"/>
  <text x="410" y="250" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="10" font-weight="bold">INTERNAL</text>
  <text x="410" y="266" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="10" font-weight="bold">VOLTAGE REGULATOR</text>

  <!-- B+ stud -->
  <rect x="560" y="196" width="20" height="28" rx="4" fill="#fbbf24"/>
  <text x="570" y="258" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="13" font-weight="bold">B+</text>

  <!-- B+ main output wire and fusible link -->
  <line x1="580" y1="210" x2="650" y2="210" stroke="#fbbf24" stroke-width="6"/>
  <rect x="650" y="196" width="80" height="28" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="690" y="215" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" font-weight="bold">FUSIBLE LINK</text>
  <line x1="730" y1="210" x2="884" y2="210" stroke="#fbbf24" stroke-width="6"/>
  <text x="690" y="247" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="11" font-weight="bold">B+ MAIN OUTPUT</text>

  <!-- Battery -->
  <rect x="900" y="150" width="150" height="130" rx="12" fill="#22c55e" stroke="rgba(20,83,45,0.6)" stroke-width="2"/>
  <text x="975" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="bold">BATTERY</text>
  <text x="975" y="232" text-anchor="middle" fill="#d1fae5" font-family="Arial,sans-serif" font-size="14">12 V</text>

  <rect x="884" y="180" width="18" height="40" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
  <text x="893" y="206" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="bold">+</text>

  <rect x="1000" y="272" width="40" height="18" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
  <text x="1020" y="285" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="bold">-</text>

  <!-- Ground -->
  <line x1="1020" y1="290" x2="1020" y2="318" stroke="#22c55e" stroke-width="5"/>
  <line x1="975" y1="318" x2="1065" y2="318" stroke="#22c55e" stroke-width="4"/>
  <line x1="987" y1="334" x2="1053" y2="334" stroke="#22c55e" stroke-width="4"/>
  <line x1="999" y1="350" x2="1041" y2="350" stroke="#22c55e" stroke-width="4"/>
  <text x="1020" y="372" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11" font-weight="bold">GND</text>

  <!-- Title -->
  <text x="600" y="460" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="bold">Sedona Alternator Wiring Diagram</text>

  <!-- Subtitle -->
  <text x="600" y="505" text-anchor="middle" fill="url(#g2)" font-family="Arial,sans-serif" font-size="22" font-weight="600">2005 Kia Sedona 3.5L V6 - Charging System Overview</text>

  <!-- Badge -->
  <rect x="450" y="530" width="300" height="30" rx="15" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="600" y="550" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">AUTOMOTIVE WIRING GUIDE</text>
</svg>