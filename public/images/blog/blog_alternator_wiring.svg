<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stat pills -->
  <rect x="70" y="42" width="250" height="32" rx="16" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="195" y="64" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="13" font-weight="bold">13.8-14.5 V CHARGE</text>

  <rect x="880" y="42" width="250" height="32" rx="16" fill="rgba(248,113,113,0.1)" stroke="rgba(248,113,113,0.35)" stroke-width="1"/>
  <text x="1005" y="64" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="13" font-weight="bold">60-180 A OUTPUT</text>

  <!-- Charge lamp -->
  <rect x="520" y="70" width="160" height="44" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <circle cx="545" cy="92" r="8" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M537 92h16" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="97" text-anchor="middle" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="11" font-weight="bold">CHARGE LAMP</text>

  <!-- Ignition switch -->
  <rect x="320" y="300" width="150" height="44" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="395" y="317" text-anchor="middle" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="11" font-weight="bold">IGNITION</text>
  <text x="395" y="332" text-anchor="middle" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="11" font-weight="bold">SWITCH</text>

  <!-- Alternator -->
  <rect x="70" y="150" width="200" height="150" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="170" y="196" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="bold">ALTERNATOR</text>
  <text x="170" y="222" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12">ROTOR + STATOR</text>
  <text x="170" y="244" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">DIODE RECTIFIER</text>

  <text x="170" y="278" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">B+  L  S  F</text>
  <circle cx="170" cy="288" r="5" fill="#22c55e"/>
  <text x="185" y="292" text-anchor="start" fill="#86efac" font-family="Arial,sans-serif" font-size="10" font-weight="bold">GND</text>

  <!-- Voltage regulator -->
  <rect x="520" y="150" width="160" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="600" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">VOLTAGE</text>
  <text x="600" y="225" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">REGULATOR</text>
  <text x="600" y="256" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="11">SENSE INPUT</text>
  <text x="600" y="276" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">REGULATES OUTPUT</text>

  <circle cx="520" cy="190" r="5" fill="#67e8f9"/>
  <circle cx="520" cy="290" r="5" fill="#22c55e"/>

  <!-- Battery -->
  <rect x="880" y="150" width="250" height="150" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="1005" y="200" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">BATTERY</text>
  <text x="1005" y="228" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="12">12 V</text>

  <rect x="920" y="246" width="160" height="10" rx="2" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="922" y="252" width="12" height="10" fill="#22c55e"/>
  <text x="907" y="262" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="14" font-weight="bold">+</text>
  <text x="1093" y="262" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="16" font-weight="bold">-</text>

  <circle cx="880" cy="180" r="5" fill="#fbbf24"/>
  <circle cx="880" cy="260" r="5" fill="#fca5a5"/>

  <!-- Wire B+ : alternator to battery -->
  <line x1="270" y1="180" x2="880" y2="180" stroke="#fbbf24" stroke-width="4"/>
  <polygon points="270,180 286,173 286,187" fill="#fbbf24" transform="rotate(0 0 0) translate(0,0)"/>
  <text x="575" y="173" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12" font-weight="bold">B+ OUTPUT</text>

  <!-- Wire L : alternator to lamp -->
  <line x1="270" y1="210" x2="520" y2="92" stroke="#818cf8" stroke-width="3"/>
  <text x="352" y="138" text-anchor="middle" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="11" font-weight="bold">L - LAMP</text>

  <!-- Wire S : alternator to regulator to battery -->
  <line x1="270" y1="245" x2="520" y2="190" stroke="#67e8f9" stroke-width="3"/>
  <text x="360" y="228" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="11" font-weight="bold">S - SENSE</text>

  <!-- Wire F : alternator to ignition -->
  <line x1="270" y1="280" x2="395" y2="300" stroke="#f472b6" stroke-width="3"/>
  <text x="283" y="300" text-anchor="middle" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="11" font-weight="bold">F - FIELD</text>

  <!-- Wire regulator to battery sense -->
  <line x1="680" y1="190" x2="880" y2="190" stroke="#67e8f9" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Ground -->
  <line x1="1005" y1="300" x2="1005" y2="340" stroke="#22c55e" stroke-width="5"/>
  <line x1="965" y1="340" x2="1045" y2="340" stroke="#22c55e" stroke-width="4"/>
  <line x1="975" y1="356" x2="1035" y2="356" stroke="#22c55e" stroke-width="4"/>
  <line x1="985" y1="372" x2="1025" y2="372" stroke="#22c55e" stroke-width="4"/>
  <text x="1005" y="396" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CHASSIS GROUND</text>

  <!-- Title -->
  <text x="600" y="470" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="bold">Alternator Wiring Diagram</text>

  <!-- Subtitle -->
  <text x="600" y="512" text-anchor="middle" fill="url(#g1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Charging Circuit: Battery, Regulator, and Harness</text>

  <!-- Badge -->
  <rect x="470" y="538" width="260" height="30" rx="15" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="600" y="558" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CHARGING SYSTEM GUIDE</text>
</svg>