<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stat pills -->
  <rect x="60" y="42" width="280" height="32" rx="16" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="200" y="63" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="12" font-weight="bold">HEALTHY OUTPUT - 13.8-14.5 V</text>

  <rect x="860" y="42" width="280" height="32" rx="16" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="1000" y="63" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CHECK AT REST - 12.4-12.6 V</text>

  <!-- Card data -->
  <!-- Card 1: B+ -->
  <rect x="60" y="120" width="212" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="60" y="120" width="212" height="44" rx="16" fill="#fbbf24"/>
  <rect x="60" y="138" width="212" height="26" fill="#fbbf24"/>
  <text x="166" y="152" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="26" font-weight="bold">B+</text>
  <text x="166" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">MAIN OUTPUT</text>
  <line x1="80" y1="218" x2="252" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="166" y="248" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Heavy output wire that carries</text>
  <text x="166" y="266" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">charging current to the battery</text>
  <text x="166" y="284" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">positive via the fusible link.</text>
  <rect x="106" y="372" width="120" height="24" rx="12" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.5)" stroke-width="1"/>
  <text x="166" y="389" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" font-weight="bold">6 AWG - 13.3 mm²</text>

  <!-- Card 2: L -->
  <rect x="288" y="120" width="212" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="288" y="120" width="212" height="44" rx="16" fill="#ef4444"/>
  <rect x="288" y="138" width="212" height="26" fill="#ef4444"/>
  <text x="394" y="152" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">L</text>
  <text x="394" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">CHARGE LAMP</text>
  <line x1="308" y1="218" x2="480" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="394" y="248" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Feeds the instrument cluster</text>
  <text x="394" y="266" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">charge warning lamp and excites</text>
  <text x="394" y="284" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">the field winding at start-up.</text>
  <rect x="334" y="372" width="120" height="24" rx="12" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
  <text x="394" y="389" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="10" font-weight="bold">WARNING CIRCUIT</text>

  <!-- Card 3: S -->
  <rect x="516" y="120" width="212" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="516" y="120" width="212" height="44" rx="16" fill="#e2e8f0"/>
  <rect x="516" y="138" width="212" height="26" fill="#e2e8f0"/>
  <text x="622" y="152" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="26" font-weight="bold">S</text>
  <text x="622" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">SENSE</text>
  <line x1="536" y1="218" x2="708" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="622" y="248" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Senses true battery voltage so</text>
  <text x="622" y="266" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">the internal regulator sets output</text>
  <text x="622" y="284" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">to 13.8-14.5 V.</text>
  <rect x="562" y="372" width="120" height="24" rx="12" fill="rgba(226,232,240,0.12)" stroke="rgba(226,232,240,0.4)" stroke-width="1"/>
  <text x="622" y="389" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">REGULATOR REFERENCE</text>

  <!-- Card 4: F -->
  <rect x="744" y="120" width="212" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="744" y="120" width="212" height="44" rx="16" fill="#3b82f6"/>
  <rect x="744" y="138" width="212" height="26" fill="#3b82f6"/>
  <text x="850" y="152" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">F</text>
  <text x="850" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">FIELD / IGNITION</text>
  <line x1="764" y1="218" x2="936" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="850" y="248" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Ignition-controlled excitation</text>
  <text x="850" y="266" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">that starts charging when the</text>
  <text x="850" y="284" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">ignition key turns to ON.</text>
  <rect x="790" y="372" width="120" height="24" rx="12" fill="rgba(59,130,246,0.18)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="850" y="389" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="10" font-weight="bold">IGNITION / FIELD</text>

  <!-- Card 5: GND -->
  <rect x="972" y="120" width="212" height="300" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="972" y="120" width="212" height="44" rx="16" fill="#22c55e"/>
  <rect x="972" y="138" width="212" height="26" fill="#22c55e"/>
  <text x="1078" y="152" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">GND</text>
  <text x="1078" y="205" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">GROUND RETURN</text>
  <line x1="992" y1="218" x2="1164" y2="218" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1078" y="248" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Chassis ground return that</text>
  <text x="1078" y="266" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">completes the charging circuit</text>
  <text x="1078" y="284" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">back to the battery negative.</text>
  <rect x="1018" y="372" width="120" height="24" rx="12" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <text x="1078" y="389" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="10" font-weight="bold">SYSTEM RETURN</text>

  <!-- Warning note -->
  <text x="600" y="452" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Match by pin position, not by color - replacement pigtails ship with different wire colors than the factory harness.</text>

  <!-- Title -->
  <text x="600" y="505" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="44" font-weight="bold">Alternator Terminals and Wire Functions</text>

  <!-- Subtitle -->
  <text x="600" y="548" text-anchor="middle" fill="url(#t1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Color Coding for the 2005 Kia Sedona</text>

  <!-- Badge -->
  <rect x="480" y="572" width="240" height="30" rx="15" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <text x="600" y="592" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="bold">WIRE COLOR GUIDE</text>
</svg>