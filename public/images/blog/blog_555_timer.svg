<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.08)" stroke-width="1">
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- VCC rail -->
  <line x1="90" y1="110" x2="1110" y2="110" stroke="#3b82f6" stroke-width="3"/>
  <text x="100" y="95" fill="#3b82f6" font-family="Arial,sans-serif" font-size="20" font-weight="bold">+VCC (9V)</text>

  <!-- GND rail -->
  <line x1="90" y1="520" x2="1110" y2="520" stroke="#64748b" stroke-width="3"/>
  <text x="100" y="548" fill="#64748b" font-family="Arial,sans-serif" font-size="20" font-weight="bold">GND</text>

  <!-- 555 IC body -->
  <rect x="430" y="250" width="170" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <text x="515" y="315" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="34" font-weight="bold">555</text>
  <text x="515" y="345" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">TIMER IC</text>

  <!-- Pin stubs (left x=430, right x=600) -->
  <g stroke="#cbd5e1" stroke-width="3">
    <!-- left pins -->
    <line x1="420" y1="270" x2="430" y2="270"/>
    <line x1="420" y1="310" x2="430" y2="310"/>
    <line x1="420" y1="350" x2="430" y2="350"/>
    <line x1="420" y1="390" x2="430" y2="390"/>
    <!-- right pins -->
    <line x1="600" y1="270" x2="610" y2="270"/>
    <line x1="600" y1="310" x2="610" y2="310"/>
    <line x1="600" y1="350" x2="610" y2="350"/>
    <line x1="600" y1="390" x2="610" y2="390"/>
  </g>

  <!-- Pin labels -->
  <g font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">
    <text x="412" y="274" text-anchor="end">1 GND</text>
    <text x="412" y="314" text-anchor="end">2 TRIG</text>
    <text x="412" y="354" text-anchor="end">3 OUT</text>
    <text x="412" y="394" text-anchor="end">4 RESET</text>
    <text x="618" y="274" text-anchor="start">8 VCC</text>
    <text x="618" y="314" text-anchor="start">7 DIS</text>
    <text x="618" y="354" text-anchor="start">6 THR</text>
    <text x="618" y="394" text-anchor="start">5 CTRL</text>
  </g>

  <!-- Pin 8 VCC to rail -->
  <line x1="600" y1="270" x2="600" y2="110" stroke="#3b82f6" stroke-width="3"/>

  <!-- Pin 4 RESET tied to VCC -->
  <line x1="430" y1="390" x2="360" y2="390" stroke="#3b82f6" stroke-width="3"/>
  <line x1="360" y1="390" x2="360" y2="110" stroke="#3b82f6" stroke-width="3"/>

  <!-- Pin 1 GND -->
  <line x1="430" y1="270" x2="430" y2="520" stroke="#64748b" stroke-width="3"/>

  <!-- Pin 5 CTRL bypass cap -->
  <line x1="600" y1="390" x2="680" y2="390" stroke="#94a3b8" stroke-width="3"/>
  <line x1="680" y1="390" x2="680" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <line x1="670" y1="410" x2="690" y2="410" stroke="#eab308" stroke-width="3"/>
  <line x1="670" y1="418" x2="690" y2="418" stroke="#eab308" stroke-width="3"/>
  <line x1="680" y1="418" x2="680" y2="520" stroke="#64748b" stroke-width="3"/>
  <text x="700" y="470" fill="#eab308" font-family="Arial,sans-serif" font-size="14">0.01µF</text>

  <!-- RA vertical resistor (VCC to node A) -->
  <rect x="688" y="110" width="24" height="200" rx="4" fill="#3b82f6"/>
  <line x1="700" y1="310" x2="700" y2="310" stroke="#fbbf24" stroke-width="0"/>
  <text x="730" y="215" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">RA</text>
  <text x="730" y="235" fill="#60a5fa" font-family="Arial,sans-serif" font-size="14">1kΩ</text>

  <!-- Node A wire to pin7 -->
  <line x1="600" y1="310" x2="700" y2="310" stroke="#fbbf24" stroke-width="4"/>

  <!-- RB horizontal resistor (node A to node B) -->
  <rect x="700" y="298" width="200" height="24" rx="4" fill="#3b82f6"/>
  <text x="800" y="288" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">RB</text>
  <text x="800" y="340" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="14">68kΩ</text>

  <!-- C timing capacitor (node B to GND) -->
  <line x1="900" y1="310" x2="900" y2="420" stroke="#fbbf24" stroke-width="4"/>
  <line x1="886" y1="420" x2="914" y2="420" stroke="#eab308" stroke-width="3"/>
  <line x1="886" y1="436" x2="914" y2="436" stroke="#eab308" stroke-width="3"/>
  <line x1="900" y1="436" x2="900" y2="520" stroke="#64748b" stroke-width="3"/>
  <text x="920" y="430" fill="#eab308" font-family="Arial,sans-serif" font-size="16" font-weight="bold">C</text>
  <text x="920" y="452" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14">10µF</text>

  <!-- Pin 6 THR to node B -->
  <line x1="600" y1="350" x2="900" y2="350" stroke="#fbbf24" stroke-width="4"/>
  <line x1="900" y1="350" x2="900" y2="310" stroke="#fbbf24" stroke-width="4"/>

  <!-- Pin 2 TRIG tied to pin6 via bottom route -->
  <line x1="430" y1="310" x2="390" y2="310" stroke="#fbbf24" stroke-width="4"/>
  <line x1="390" y1="310" x2="390" y2="470" stroke="#fbbf24" stroke-width="4"/>
  <line x1="390" y1="470" x2="600" y2="470" stroke="#fbbf24" stroke-width="4"/>
  <line x1="600" y1="470" x2="600" y2="350" stroke="#fbbf24" stroke-width="4"/>

  <!-- Pin 3 OUT -> resistor -> LED -> GND -->
  <line x1="430" y1="350" x2="320" y2="350" stroke="#fbbf24" stroke-width="4"/>
  <rect x="308" y="350" width="24" height="60" rx="4" fill="#3b82f6"/>
  <text x="344" y="380" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="bold">330Ω</text>
  <line x1="320" y1="410" x2="320" y2="430" stroke="#fbbf24" stroke-width="4"/>
  <!-- LED -->
  <circle cx="320" cy="445" r="18" fill="#ef4444"/>
  <line x1="320" y1="463" x2="320" y2="520" stroke="#fbbf24" stroke-width="4"/>
  <text x="290" y="470" text-anchor="end" fill="#fca5a5" font-family="Arial,sans-serif" font-size="14" font-weight="bold">LED</text>

  <!-- Connection dots -->
  <g fill="#fbbf24">
    <circle cx="600" cy="270" r="5"/>
    <circle cx="600" cy="310" r="5"/>
    <circle cx="700" cy="310" r="5"/>
    <circle cx="900" cy="310" r="5"/>
    <circle cx="600" cy="350" r="5"/>
    <circle cx="600" cy="470" r="5"/>
    <circle cx="390" cy="470" r="5"/>
    <circle cx="430" cy="310" r="5"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="360" cy="390" r="5"/>
  </g>

  <!-- Title -->
  <text x="600" y="575" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="44" font-weight="bold">555 Timer Circuit</text>
  <text x="600" y="610" text-anchor="middle" fill="url(#g1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Astable, Monostable, Bistable &amp; PWM</text>
</svg>
