<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Resistor symbol (zigzag) -->
  <polyline points="160,190 180,170 200,210 220,170 240,210 260,170 280,190" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="190" x2="160" y2="190" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="190" x2="340" y2="190" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <text x="220" y="155" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="16" font-weight="bold">R1</text>

  <!-- Capacitor symbol -->
  <line x1="480" y1="170" x2="480" y2="210" stroke="#22d3ee" stroke-width="4"/>
  <line x1="510" y1="170" x2="510" y2="210" stroke="#22d3ee" stroke-width="4"/>
  <line x1="420" y1="190" x2="480" y2="190" stroke="#22d3ee" stroke-width="4"/>
  <line x1="510" y1="190" x2="570" y2="190" stroke="#22d3ee" stroke-width="4"/>
  <text x="495" y="155" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="16" font-weight="bold">C1</text>

  <!-- LED symbol -->
  <polygon points="740,170 740,210 780,190" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round"/>
  <line x1="780" y1="170" x2="780" y2="210" stroke="#22c55e" stroke-width="4"/>
  <line x1="690" y1="190" x2="740" y2="190" stroke="#22c55e" stroke-width="4"/>
  <line x1="780" y1="190" x2="830" y2="190" stroke="#22c55e" stroke-width="4"/>
  <!-- LED arrows -->
  <line x1="790" y1="170" x2="810" y2="155" stroke="#22c55e" stroke-width="2"/>
  <line x1="810" y1="155" x2="805" y2="162" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="803" y1="164" x2="808" y2="158" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="800" y1="175" x2="820" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="820" y1="160" x2="815" y2="167" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="813" y1="169" x2="818" y2="163" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <text x="760" y="155" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="16" font-weight="bold">D1</text>

  <!-- Ground symbol -->
  <line x1="980" y1="170" x2="980" y2="190" stroke="#94a3b8" stroke-width="4"/>
  <line x1="960" y1="190" x2="1000" y2="190" stroke="#94a3b8" stroke-width="4"/>
  <line x1="967" y1="200" x2="993" y2="200" stroke="#94a3b8" stroke-width="3"/>
  <line x1="974" y1="210" x2="986" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- Connection line -->
  <line x1="340" y1="190" x2="420" y2="190" stroke="rgba(148,163,184,0.4)" stroke-width="2"/>
  <line x1="570" y1="190" x2="690" y2="190" stroke="rgba(148,163,184,0.4)" stroke-width="2"/>
  <line x1="830" y1="190" x2="980" y2="190" stroke="rgba(148,163,184,0.4)" stroke-width="2"/>

  <!-- IC chip -->
  <rect x="450" y="300" width="130" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="3"/>
  <text x="515" y="350" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="bold">IC</text>
  <text x="515" y="378" text-anchor="middle" fill="#a78bfa" font-family="Arial,sans-serif" font-size="14">U1</text>

  <!-- Transistor symbol -->
  <circle cx="250" cy="350" r="30" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <line x1="230" y1="350" x2="250" y2="350" stroke="#f59e0b" stroke-width="3"/>
  <line x1="250" y1="330" x2="250" y2="350" stroke="#f59e0b" stroke-width="3"/>
  <line x1="250" y1="350" x2="270" y2="370" stroke="#f59e0b" stroke-width="3"/>
  <line x1="250" y1="350" x2="270" y2="330" stroke="#f59e0b" stroke-width="3"/>
  <text x="250" y="405" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Q1</text>

  <!-- Switch symbol -->
  <circle cx="800" cy="330" r="4" fill="#ef4444"/>
  <line x1="800" y1="330" x2="860" y2="310" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="860" cy="330" r="4" fill="#ef4444"/>
  <text x="830" y="370" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="16" font-weight="bold">S1</text>

  <!-- Inductor symbol -->
  <path d="M1000,320 Q1015,320 1015,340 Q1015,360 1030,360 Q1045,360 1045,340 Q1045,320 1060,320 Q1075,320 1075,340 Q1075,360 1090,360" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <text x="1045" y="390" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="16" font-weight="bold">L1</text>

  <!-- Title -->
  <text x="600" y="545" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="44" font-weight="bold">Electrical Symbols</text>
  <text x="600" y="585" text-anchor="middle" fill="url(#g1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">The Building Blocks of Circuit Diagrams</text>
</svg>