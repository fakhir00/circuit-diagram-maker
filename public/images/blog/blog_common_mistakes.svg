<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Grid -->
  <g stroke="rgba(239,68,68,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Wrong circuit (left) -->
  <g opacity="0.6">
    <line x1="100" y1="200" x2="300" y2="200" stroke="#ef4444" stroke-width="3"/>
    <rect x="300" y="170" width="80" height="60" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="340" y="205" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="12">R?</text>
    <line x1="380" y1="200" x2="480" y2="200" stroke="#ef4444" stroke-width="3"/>
    <circle cx="520" cy="200" r="30" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="520" y="205" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">LED?</text>
    <line x1="550" y1="200" x2="650" y2="200" stroke="#ef4444" stroke-width="3"/>
    
    <!-- X mark -->
    <line x1="350" y1="130" x2="400" y2="180" stroke="#ef4444" stroke-width="4"/>
    <line x1="400" y1="130" x2="350" y2="180" stroke="#ef4444" stroke-width="4"/>
  </g>
  
  <!-- Right circuit (right) -->
  <g opacity="0.6">
    <line x1="650" y1="200" x2="720" y2="200" stroke="#22c55e" stroke-width="3"/>
    <rect x="720" y="175" width="70" height="50" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="755" y="205" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="11">330Ω</text>
    <line x1="790" y1="200" x2="860" y2="200" stroke="#22c55e" stroke-width="3"/>
    <circle cx="900" cy="200" r="30" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="900" y="205" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="10">LED1</text>
    <line x1="930" y1="200" x2="1000" y2="200" stroke="#22c55e" stroke-width="3"/>
    
    <!-- Check mark -->
    <polyline points="855,155 870,175 900,140" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- VS circle -->
  <circle cx="575" cy="200" r="35" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="575" y="207" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="bold">VS</text>
  
  <!-- Warning icons -->
  <g fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4">
    <polygon points="150,350 180,410 120,410"/>
    <text x="150" y="395" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="18" font-weight="bold">!</text>
    
    <polygon points="350,380 380,440 320,440"/>
    <text x="350" y="425" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="18" font-weight="bold">!</text>
    
    <polygon points="550,350 580,410 520,410"/>
    <text x="550" y="395" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="18" font-weight="bold">!</text>
    
    <polygon points="750,380 780,440 720,440"/>
    <text x="750" y="425" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="18" font-weight="bold">!</text>
    
    <polygon points="950,350 980,410 920,410"/>
    <text x="950" y="395" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="18" font-weight="bold">!</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="bold">Common Circuit Diagram Mistakes</text>
  
  <!-- Subtitle -->
  <text x="600" y="555" text-anchor="middle" fill="url(#g2)" font-family="Arial,sans-serif" font-size="22" font-weight="600">10 Errors That Break Your Design</text>
  
  <!-- Badge -->
  <rect x="490" y="575" width="220" height="30" rx="15" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="600" y="596" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="12" font-weight="bold">TROUBLESHOOTING GUIDE</text>
</svg>