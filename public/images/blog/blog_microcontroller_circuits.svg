<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <g stroke="rgba(59,130,246,0.07)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="60" y="70" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="bold">Microcontroller Schematic Layout</text>
  <text x="60" y="102" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">split symbols &#183; bus notation &#183; crystals &#183; decoupling &#183; peripherals</text>

  <!-- Rails -->
  <line x1="170" y1="160" x2="1100" y2="160" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="147" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">+3V3</text>
  <line x1="170" y1="520" x2="1100" y2="520" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- Reset network -->
  <line x1="200" y1="160" x2="200" y2="205" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="200" cy="160" r="6" fill="#f59e0b"/>
  <polyline points="200,205 182,216 218,233 182,250 218,267 200,278" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="232" y="228" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">10k</text>
  <line x1="200" y1="278" x2="200" y2="330" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="200" cy="290" r="6" fill="#3b82f6"/>
  <line x1="176" y1="330" x2="224" y2="330" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="176" y1="347" x2="224" y2="347" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="347" x2="200" y2="520" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="200" cy="520" r="6" fill="#94a3b8"/>
  <text x="232" y="328" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">100n</text>
  <line x1="200" y1="290" x2="480" y2="290" stroke="#3b82f6" stroke-width="4"/>

  <!-- Crystal -->
  <line x1="480" y1="340" x2="400" y2="340" stroke="#22c55e" stroke-width="4"/>
  <line x1="480" y1="380" x2="400" y2="380" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="340" x2="400" y2="352" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="380" x2="400" y2="368" stroke="#22c55e" stroke-width="4"/>
  <line x1="384" y1="352" x2="416" y2="352" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="384" y1="368" x2="416" y2="368" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <rect x="388" y="354" width="24" height="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="374" y="404" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Y1 16MHz</text>
  <circle cx="400" cy="340" r="6" fill="#22c55e"/>
  <circle cx="400" cy="380" r="6" fill="#22c55e"/>
  <line x1="400" y1="340" x2="340" y2="340" stroke="#22d3ee" stroke-width="3"/>
  <line x1="340" y1="340" x2="340" y2="430" stroke="#22d3ee" stroke-width="3"/>
  <line x1="316" y1="430" x2="364" y2="430" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="316" y1="447" x2="364" y2="447" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="447" x2="340" y2="520" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="340" cy="520" r="6" fill="#94a3b8"/>
  <text x="308" y="428" text-anchor="end" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">22p</text>
  <line x1="400" y1="380" x2="444" y2="380" stroke="#22d3ee" stroke-width="3"/>
  <line x1="444" y1="380" x2="444" y2="430" stroke="#22d3ee" stroke-width="3"/>
  <line x1="420" y1="430" x2="468" y2="430" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="420" y1="447" x2="468" y2="447" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="444" y1="447" x2="444" y2="520" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="444" cy="520" r="6" fill="#94a3b8"/>
  <text x="452" y="470" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">22p</text>

  <!-- MCU -->
  <rect x="480" y="250" width="280" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
  <text x="620" y="352" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold">U1 MCU</text>
  <text x="620" y="382" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">CORE + PORT D</text>
  <text x="490" y="296" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">nRST</text>
  <text x="490" y="346" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">XIN</text>
  <text x="490" y="386" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">XOUT</text>
  <text x="750" y="296" text-anchor="end" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">PD0-7</text>
  <text x="750" y="426" text-anchor="end" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">I2C</text>
  <line x1="560" y1="250" x2="560" y2="160" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="560" cy="160" r="6" fill="#f59e0b"/>
  <line x1="680" y1="250" x2="680" y2="160" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="680" cy="160" r="6" fill="#f59e0b"/>
  <line x1="560" y1="470" x2="560" y2="520" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="560" cy="520" r="6" fill="#94a3b8"/>
  <line x1="680" y1="470" x2="680" y2="520" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="680" cy="520" r="6" fill="#94a3b8"/>

  <!-- Decoupling group -->
  <circle cx="940" cy="160" r="6" fill="#f59e0b"/>
  <line x1="940" y1="160" x2="940" y2="212" stroke="#22d3ee" stroke-width="4"/>
  <line x1="916" y1="212" x2="964" y2="212" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="916" y1="229" x2="964" y2="229" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="940" y1="229" x2="940" y2="252" stroke="#94a3b8" stroke-width="4"/>
  <line x1="916" y1="252" x2="964" y2="252" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="924" y1="262" x2="956" y2="262" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="932" y1="272" x2="948" y2="272" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <text x="976" y="216" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">100n per VDD pin</text>

  <!-- Bus to motor driver -->
  <line x1="760" y1="300" x2="880" y2="300" stroke="#a78bfa" stroke-width="9" stroke-linecap="round"/>
  <line x1="846" y1="286" x2="866" y2="314" stroke="#c4b5fd" stroke-width="3"/>
  <text x="874" y="288" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">8</text>
  <text x="808" y="286" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">D[0..7]</text>
  <rect x="880" y="262" width="180" height="106" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
  <text x="970" y="308" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">MOTOR DRIVER</text>
  <text x="970" y="334" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">H-BRIDGE</text>
  <line x1="1060" y1="315" x2="1092" y2="315" stroke="#22c55e" stroke-width="5"/>
  <circle cx="1118" cy="315" r="26" fill="none" stroke="#22c55e" stroke-width="4"/>
  <text x="1118" y="324" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">M</text>

  <!-- I2C to display -->
  <line x1="760" y1="420" x2="880" y2="420" stroke="#22d3ee" stroke-width="4"/>
  <text x="812" y="410" text-anchor="middle" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">SDA / SCL</text>
  <rect x="880" y="392" width="180" height="72" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="4"/>
  <text x="970" y="436" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">OLED</text>

  <!-- Ground symbol -->
  <line x1="760" y1="520" x2="760" y2="542" stroke="#94a3b8" stroke-width="4"/>
  <line x1="736" y1="542" x2="784" y2="542" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="744" y1="553" x2="776" y2="553" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="752" y1="564" x2="768" y2="564" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <text x="320" y="580" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">SUPPORT COMPONENTS AT THEIR PINS</text>
  <text x="950" y="580" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">BUS NOTATION</text>
  <text x="1140" y="610" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Split big MCUs into functional symbol parts</text>
</svg>
