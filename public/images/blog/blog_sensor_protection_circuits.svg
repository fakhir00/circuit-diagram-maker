  <line x1="880" y1="365" x2="916" y2="365" stroke="#3b82f6" stroke-width="4"/>
  <text x="972" y="410" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">Q1</text>
  <polyline points="800,365 810,350 830,380 850,350 870,380 880,365" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="404" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Rg</text>
  <line x1="768" y1="365" x2="800" y2="365" stroke="#a78bfa" stroke-width="4"/>
  <text x="762" y="371" text-anchor="end" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">GPIO</text>
  <text x="960" y="556" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">SWITCHING + FLYBACK</text>

