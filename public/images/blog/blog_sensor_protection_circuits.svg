  <text x="60" y="76" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="bold">Sensor &amp; Protection Circuit Diagrams</text>
  <text x="60" y="110" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">pull-ups &#183; voltage dividers &#183; MOSFET switching &#183; debounce</text>

