  <line x1="930" y1="345" x2="950" y2="345" stroke="#3b82f6" stroke-width="4"/>
  <line x1="930" y1="338" x2="930" y2="392" stroke="#3b82f6" stroke-width="5"/>
  <line x1="916" y1="338" x2="916" y2="392" stroke="#3b82f6" stroke-width="5"/>
  <line x1="930" y1="385" x2="950" y2="385" stroke="#3b82f6" stroke-width="4"/>
  <line x1="950" y1="385" x2="950" y2="500" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="950" cy="500" r="6" fill="#94a3b8"/>
  <line x1="934" y1="365" x2="948" y2="365" stroke="#3b82f6" stroke-width="4"/>
