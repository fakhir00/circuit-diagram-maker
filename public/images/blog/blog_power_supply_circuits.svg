<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <g stroke="rgba(59,130,246,0.07)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="60" y="76" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold">Power Supply Circuit Design</text>
  <text x="60" y="110" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">isolation barriers &#183; rectifiers &#183; filter caps &#183; 78xx regulators</text>

  <!-- Isolation barrier -->
  <line x1="300" y1="170" x2="300" y2="560" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="300" y="158" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">ISOLATION BARRIER</text>

  <!-- AC source -->
  <circle cx="120" cy="300" r="34" fill="none" stroke="#f472b6" stroke-width="4"/>
  <path d="M100,300 Q110,281 120,300 Q130,319 140,300" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="266" x2="120" y2="240" stroke="#f472b6" stroke-width="4"/>
  <line x1="120" y1="240" x2="280" y2="240" stroke="#f472b6" stroke-width="4"/>
  <line x1="120" y1="334" x2="120" y2="360" stroke="#f472b6" stroke-width="4"/>
  <line x1="120" y1="360" x2="280" y2="360" stroke="#f472b6" stroke-width="4"/>
  <text x="120" y="370" text-anchor="middle" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold"> </text>

  <!-- Transformer -->
  <path d="M280,240 A20,20 0 0 0 280,280 A20,20 0 0 0 280,320 A20,20 0 0 0 280,360" fill="none" stroke="#f472b6" stroke-width="4"/>
  <line x1="296" y1="232" x2="296" y2="368" stroke="#94a3b8" stroke-width="3"/>
  <line x1="304" y1="232" x2="304" y2="368" stroke="#94a3b8" stroke-width="3"/>
  <path d="M320,240 A20,20 0 0 1 320,280 A20,20 0 0 1 320,320 A20,20 0 0 1 320,360" fill="none" stroke="#22d3ee" stroke-width="4"/>
  <text x="252" y="224" text-anchor="middle" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">T1</text>

  <!-- Bridge rectifier diamond -->
  <polygon points="410,300 470,240 530,300 470,360" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <text x="470" y="308" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">BR1</text>
  <text x="398" y="308" text-anchor="end" fill="#22d3ee" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">~</text>
  <text x="546" y="308" fill="#22d3ee" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">~</text>
  <text x="470" y="228" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">+</text>
  <text x="490" y="392" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold">&#8722;</text>

  <!-- Secondary to bridge AC nodes -->
  <line x1="320" y1="240" x2="410" y2="240" stroke="#22d3ee" stroke-width="4"/>
  <line x1="410" y1="240" x2="410" y2="300" stroke="#22d3ee" stroke-width="4"/>
  <line x1="320" y1="360" x2="320" y2="430" stroke="#22d3ee" stroke-width="4"/>
  <line x1="320" y1="430" x2="530" y2="430" stroke="#22d3ee" stroke-width="4"/>
  <line x1="530" y1="430" x2="530" y2="300" stroke="#22d3ee" stroke-width="4"/>

  <!-- DC minus down to ground (plain crossover, no dot) -->
  <line x1="470" y1="360" x2="470" y2="500" stroke="#94a3b8" stroke-width="4"/>

  <!-- DC plus rail (thick = high current) -->
  <line x1="470" y1="240" x2="470" y2="200" stroke="#f59e0b" stroke-width="7"/>
  <line x1="470" y1="200" x2="800" y2="200" stroke="#f59e0b" stroke-width="7"/>

  <!-- Filter cap C1 -->
  <circle cx="700" cy="200" r="6" fill="#f59e0b"/>
  <line x1="700" y1="200" x2="700" y2="380" stroke="#22d3ee" stroke-width="4"/>
  <line x1="672" y1="380" x2="728" y2="380" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <path d="M672,400 Q700,384 728,400" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="700" y1="394" x2="700" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <text x="742" y="376" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">C1 2200u</text>
  <text x="676" y="352" text-anchor="end" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">+</text>

  <!-- Regulator -->
  <rect x="800" y="158" width="180" height="84" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
  <text x="890" y="196" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold">U1 7805</text>
  <text x="890" y="224" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">IN &#8594; OUT</text>
  <line x1="890" y1="242" x2="890" y2="500" stroke="#94a3b8" stroke-width="4"/>

  <!-- Output -->
  <line x1="980" y1="200" x2="1100" y2="200" stroke="#22c55e" stroke-width="7"/>
  <circle cx="1030" cy="200" r="6" fill="#22c55e"/>
  <line x1="1030" y1="200" x2="1030" y2="300" stroke="#22d3ee" stroke-width="4"/>
  <line x1="1005" y1="300" x2="1055" y2="300" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="1005" y1="318" x2="1055" y2="318" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="1030" y1="318" x2="1030" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <text x="1068" y="296" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">C2</text>
  <circle cx="1108" cy="200" r="9" fill="none" stroke="#22c55e" stroke-width="4"/>
  <text x="1108" y="168" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">+5V</text>

  <!-- Ground rail -->
  <line x1="380" y1="500" x2="1100" y2="500" stroke="#94a3b8" stroke-width="7"/>
  <circle cx="470" cy="500" r="6" fill="#94a3b8"/>
  <circle cx="700" cy="500" r="6" fill="#94a3b8"/>
  <circle cx="890" cy="500" r="6" fill="#94a3b8"/>
  <circle cx="1030" cy="500" r="6" fill="#94a3b8"/>
  <line x1="580" y1="500" x2="580" y2="522" stroke="#94a3b8" stroke-width="4"/>
  <line x1="553" y1="522" x2="607" y2="522" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="562" y1="533" x2="598" y2="533" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="571" y1="544" x2="589" y2="544" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <text x="170" y="582" text-anchor="middle" fill="#f87171" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">PRIMARY &#183; HIGH VOLTAGE</text>
  <text x="760" y="582" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">SECONDARY &#183; LOW VOLTAGE</text>
  <text x="1140" y="612" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Thick lines mark high-current paths</text>
</svg>
