<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <g stroke="rgba(59,130,246,0.07)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="60" y="76" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold">Logic Gate Circuit Diagrams</text>
  <text x="60" y="110" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">ANSI distinctive shapes &#183; IEC/DIN rectangles &#183; flip-flops &#183; counters</text>

  <!-- AND -->
  <path d="M120,240 L155,240 A40,40 0 0 1 155,320 L120,320 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
  <line x1="80" y1="260" x2="120" y2="260" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="300" x2="120" y2="300" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="280" x2="235" y2="280" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <text x="157" y="358" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">AND</text>

  <!-- OR -->
  <path d="M320,240 Q350,280 320,320 Q390,320 415,280 Q390,240 320,240 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
  <line x1="280" y1="260" x2="333" y2="260" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="333" y2="300" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="415" y1="280" x2="455" y2="280" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <text x="367" y="358" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">OR</text>

  <!-- NOT -->
  <polygon points="540,240 540,320 600,280" fill="#1e293b" stroke="#22d3ee" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="609" cy="280" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="4"/>
  <line x1="500" y1="280" x2="540" y2="280" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="618" y1="280" x2="660" y2="280" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <text x="575" y="358" text-anchor="middle" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">NOT</text>

  <!-- XOR -->
  <path d="M745,240 Q775,280 745,320 Q815,320 840,280 Q815,240 745,240 Z" fill="#1e293b" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round"/>
  <path d="M727,240 Q757,280 727,320" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <line x1="686" y1="260" x2="740" y2="260" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <line x1="686" y1="300" x2="740" y2="300" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <line x1="840" y1="280" x2="880" y2="280" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <text x="790" y="358" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">XOR</text>

  <!-- Flip-flop -->
  <rect x="960" y="230" width="130" height="100" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
  <text x="1025" y="272" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">D FF</text>
  <text x="1025" y="300" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">1 bit</text>
  <line x1="915" y1="255" x2="960" y2="255" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="915" y1="305" x2="960" y2="305" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="1090" y1="280" x2="1135" y2="280" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <text x="1025" y="358" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">FLIP-FLOP</text>

  <!-- IEC row -->
  <rect x="120" y="430" width="95" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <text x="167" y="482" text-anchor="middle" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold">&amp;</text>
  <rect x="300" y="430" width="95" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <text x="347" y="482" text-anchor="middle" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold">&#8805;1</text>
  <rect x="480" y="430" width="95" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <text x="527" y="482" text-anchor="middle" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold">=1</text>
  <text x="620" y="482" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">IEC 60617 rectangles &#8212; same gates, different dialect</text>

  <text x="1140" y="604" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">Inputs left &#183; outputs right &#183; bubble means inversion</text>
</svg>
