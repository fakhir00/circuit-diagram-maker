<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <g stroke="rgba(59,130,246,0.07)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="60" y="76" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="bold">Measurement &amp; Test Circuit Diagrams</text>
  <text x="60" y="110" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">test points &#183; shunt resistors &#183; Kelvin sense &#183; probe loading</text>

  <!-- Rails -->
  <line x1="140" y1="190" x2="640" y2="190" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="140" y="176" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">V+</text>
  <line x1="140" y1="500" x2="1080" y2="500" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- Load in the current path (thick) -->
  <line x1="260" y1="190" x2="260" y2="232" stroke="#f59e0b" stroke-width="7"/>
  <rect x="200" y="232" width="120" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
  <text x="260" y="280" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold">LOAD</text>
  <line x1="260" y1="312" x2="260" y2="400" stroke="#f59e0b" stroke-width="7"/>

  <!-- Shunt resistor -->
  <polyline points="260,400 242,410 278,427 242,444 278,461 260,470" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="228" y="440" text-anchor="end" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">Rshunt</text>
  <text x="228" y="462" text-anchor="end" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">0R01</text>
  <line x1="260" y1="470" x2="260" y2="500" stroke="#f59e0b" stroke-width="7"/>
  <circle cx="260" cy="500" r="6" fill="#94a3b8"/>

  <!-- Kelvin sense taps: thin lines -->
  <circle cx="260" cy="400" r="5" fill="#22d3ee"/>
  <circle cx="260" cy="470" r="5" fill="#22d3ee"/>
  <line x1="260" y1="400" x2="392" y2="400" stroke="#22d3ee" stroke-width="2"/>
  <line x1="392" y1="400" x2="392" y2="412" stroke="#22d3ee" stroke-width="2"/>
  <line x1="392" y1="412" x2="424" y2="412" stroke="#22d3ee" stroke-width="2"/>
  <line x1="260" y1="470" x2="392" y2="470" stroke="#22d3ee" stroke-width="2"/>
  <line x1="392" y1="470" x2="392" y2="452" stroke="#22d3ee" stroke-width="2"/>
  <line x1="392" y1="452" x2="424" y2="452" stroke="#22d3ee" stroke-width="2"/>
  <text x="452" y="378" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">KELVIN SENSE</text>

  <!-- Differential amp -->
  <polygon points="424,396 424,468 492,432" fill="#1e293b" stroke="#22d3ee" stroke-width="4" stroke-linejoin="round"/>
  <text x="437" y="419" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold">&#8722;</text>
  <text x="437" y="455" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">+</text>
  <line x1="492" y1="432" x2="556" y2="432" stroke="#22c55e" stroke-width="4"/>
  <polygon points="568,432 554,425 554,439" fill="#22c55e"/>
  <text x="512" y="418" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">I SENSE</text>

  <text x="330" y="556" text-anchor="middle" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">SHUNT + DIFFERENTIAL SENSE</text>

  <!-- DUT node, test point, scope -->
  <circle cx="720" cy="300" r="8" fill="none" stroke="#a78bfa" stroke-width="4"/>
  <text x="706" y="272" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">DUT NODE</text>
  <line x1="728" y1="300" x2="900" y2="300" stroke="#a78bfa" stroke-width="4"/>

  <!-- Test point flag -->
  <circle cx="790" cy="300" r="6" fill="#a78bfa"/>
  <line x1="790" y1="300" x2="790" y2="252" stroke="#22c55e" stroke-width="4"/>
  <circle cx="790" cy="243" r="9" fill="none" stroke="#22c55e" stroke-width="4"/>
  <text x="790" y="222" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">TP1</text>
  <text x="828" y="249" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">expect 3.3V p-p</text>

  <!-- Scope drawn as a load -->
  <rect x="900" y="250" width="210" height="152" rx="10" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1005" y="288" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">SCOPE</text>
  <text x="1005" y="316" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">1M &#8741; 20p</text>
  <path d="M925,378 L925,344 L955,344 L955,378 L985,378 L985,344 L1015,344 L1015,378 L1045,378 L1045,352" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>
  <line x1="1005" y1="402" x2="1005" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="1005" cy="500" r="6" fill="#94a3b8"/>
  <text x="1018" y="452" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">PROBE GND</text>
  <text x="1018" y="472" fill="#f87171" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold">EARTH REFERENCED</text>

  <text x="900" y="556" text-anchor="middle" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold">INSTRUMENT DRAWN AS A LOAD</text>

  <!-- Ground symbol -->
  <line x1="620" y1="500" x2="620" y2="522" stroke="#94a3b8" stroke-width="4"/>
  <line x1="596" y1="522" x2="644" y2="522" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="604" y1="533" x2="636" y2="533" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="612" y1="544" x2="628" y2="544" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <text x="1140" y="604" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Thick = current path &#183; thin = sense path</text>
</svg>
