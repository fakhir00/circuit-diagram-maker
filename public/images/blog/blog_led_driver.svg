<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Circuit line top -->
  <line x1="150" y1="250" x2="1050" y2="250" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Battery -->
  <rect x="150" y="210" width="120" height="80" rx="8" fill="#22c55e"/>
  <rect x="180" y="195" width="60" height="15" fill="#22c55e"/>
  <text x="210" y="245" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="bold">9V</text>
  <text x="210" y="270" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14">DC</text>
  
  <!-- Wire from battery to resistor -->
  <line x1="270" y1="250" x2="350" y2="250" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- Resistor -->
  <rect x="350" y="220" width="150" height="60" rx="6" fill="#3b82f6"/>
  <rect x="370" y="228" width="12" height="44" fill="#ef4444" rx="2"/>
  <rect x="392" y="228" width="12" height="44" fill="#22c55e" rx="2"/>
  <rect x="414" y="228" width="12" height="44" fill="#eab308" rx="2"/>
  <rect x="466" y="228" width="12" height="44" fill="#a855f7" rx="2"/>
  <text x="425" y="305" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="bold">330Ω</text>
  
  <!-- Wire from resistor to LED -->
  <line x1="500" y1="250" x2="600" y2="250" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- LED -->
  <circle cx="660" cy="250" r="50" fill="#ef4444"/>
  <circle cx="660" cy="250" r="35" fill="#fca5a5" opacity="0.6"/>
  
  <!-- LED legs -->
  <line x1="645" y1="300" x2="645" y2="350" stroke="#94a3b8" stroke-width="4"/>
  <line x1="675" y1="300" x2="675" y2="370" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Light rays -->
  <g stroke="#fca5a5" stroke-width="3" opacity="0.7">
    <line x1="660" y1="180" x2="660" y2="150"/>
    <line x1="720" y1="200" x2="750" y2="180"/>
    <line x1="730" y1="250" x2="760" y2="250"/>
    <line x1="720" y1="300" x2="750" y2="320"/>
    <line x1="600" y1="200" x2="570" y2="180"/>
  </g>
  
  <text x="660" y="395" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="bold">LED</text>
  
  <!-- Wire from LED to ground -->
  <line x1="675" y1="370" x2="675" y2="420" stroke="#fbbf24" stroke-width="4"/>
  <line x1="675" y1="420" x2="900" y2="420" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- Ground symbol -->
  <line x1="900" y1="420" x2="900" y2="460" stroke="#64748b" stroke-width="4"/>
  <line x1="860" y1="460" x2="940" y2="460" stroke="#64748b" stroke-width="4"/>
  <line x1="875" y1="475" x2="925" y2="475" stroke="#64748b" stroke-width="3"/>
  <line x1="888" y1="490" x2="912" y2="490" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="520" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="14">GND</text>
  
  <!-- Connection dots -->
  <circle cx="270" cy="250" r="6" fill="#fbbf24"/>
  <circle cx="500" cy="250" r="6" fill="#fbbf24"/>
  <circle cx="600" cy="250" r="6" fill="#fbbf24"/>
  
  <!-- Title -->
  <text x="600" y="550" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="bold">Simple LED Driver Circuit</text>
  
  <!-- Subtitle -->
  <text x="600" y="590" text-anchor="middle" fill="url(#g1)" font-family="Arial,sans-serif" font-size="22" font-weight="600">Step-by-Step Guide for Beginners</text>
  
  <!-- Badge -->
  <rect x="520" y="600" width="160" height="25" rx="12" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="600" y="618" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">DIY ELECTRONICS</text>
</svg>